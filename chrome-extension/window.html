<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification Manager</title>
  <link rel="stylesheet" href="window.css">
</head>
<body>
  <header>
    <div>
      <h1>Notification Manager</h1>
      <div id="account" class="account">Connect Google Calendar</div>
    </div>
    <button id="refresh" class="icon-button" title="Refresh events" aria-label="Refresh events">↻</button>
  </header>
  <div id="notice" class="notice" role="status"></div>
  <section id="connect-panel" class="connect-panel" hidden>
    <p>Connect the Chrome profile that uses your primary Google Calendar.</p>
    <button id="connect">Connect Google Calendar</button>
  </section>
  <main id="event-list" aria-label="Past calendar events"></main>
  <footer>
    <span id="count"></span>
    <label>Look back
      <select id="lookback">
        <option value="7">7 days</option>
        <option value="14">14 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
        <option value="365">365 days</option>
      </select>
    </label>
  </footer>
  <input id="date-picker" type="date" aria-label="Move event to date">
  <script type="module" src="window.js"></script>
</body>
</html>
