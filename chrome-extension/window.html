<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification Manager</title>
  <link rel="stylesheet" href="window.css">
</head>
<body>
  <header>
    <div class="header-main">
      <div id="header-heading" class="header-heading">
        <span class="header-title">Notification Manager</span>
        <button id="search-toggle" class="icon-button search-icon" title="Search events" aria-label="Search events">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
        </button>
        <button id="real-events-toggle" class="icon-button search-icon" title="Show real events only" aria-label="Show real events only" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
        </button>
      </div>
      <div id="search-controls" hidden>
        <input id="search-query" type="search" placeholder="Search loaded events" aria-label="Search loaded events">
        <button id="search-close" class="icon-button" aria-label="Close search">×</button>
      </div>
      <div id="account" class="account"><span id="account-clock"></span><span id="sync-warning" class="sync-warning" role="status"></span></div>
    </div>
    <button id="menu-toggle" class="icon-button" title="Menu" aria-label="Menu" aria-expanded="false">⋮</button>
    <nav id="menu" aria-label="Notification Manager settings" hidden>
      <button id="logout">⇥ &nbsp; Disconnect / Switch Chrome Profile</button>
      <div id="account-email" class="menu-account"></div>
      <button id="sync-open"><span id="sync-menu-label">Sync issues</span></button>
      <button id="refresh">↻ &nbsp; Refresh events</button>
      <button id="presets-open">Window: <span id="preset-label">Current: 7 days back to today</span></button>
      <button id="estimate-storage" hidden>Estimate 1-year storage</button>
      <button id="theme-toggle">Dark mode: On</button>
      <button id="skins-open">Skins</button>
    </nav>
  </header>
  <div id="notice" class="notice" role="status"></div>
  <div id="info" class="info" role="status"></div>
  <section id="connect-panel" class="connect-panel" hidden>
    <p>Connect the Chrome profile that uses your primary Google Calendar.</p>
    <button id="connect">Connect Google Calendar</button>
  </section>
  <div id="pull-indicator" role="status" hidden></div>
  <main id="event-list" aria-label="Calendar events"></main>
  <footer><span id="count"></span></footer>
  <dialog id="presets-dialog">
    <h2>Review window</h2>
    <div id="preset-choices"></div>
    <button id="lookback-open">Custom lookback: <span id="lookback-label">7 days</span></button>
    <button id="lookahead-open">Custom lookahead: <span id="lookahead-label">0 days</span></button>
    <div class="dialog-actions"><button id="presets-cancel">Cancel</button></div>
  </dialog>
  <dialog id="sync-dialog">
    <h2>Sync details</h2>
    <p id="sync-detail" style="white-space:pre-line"></p>
    <p class="dialog-help">Recent actions is a 30-day log in this Chrome profile of moves, dismissals, Undo, and failures.</p>
    <button id="history-open">View recent actions</button>
    <div class="dialog-actions"><button id="sync-close">Close</button></div>
  </dialog>
  <dialog id="history-dialog">
    <h2>Recent actions</h2>
    <textarea id="history-log" readonly aria-label="Recent actions log"></textarea>
    <p id="history-copy-status" class="dialog-help" role="status"></p>
    <div class="dialog-actions"><button id="history-copy">Copy log</button><button id="history-close">Back</button></div>
  </dialog>
  <dialog id="lookback-dialog">
    <h2>Show past events</h2>
    <button data-days="7">Last 7 days</button>
    <button data-days="14">Last 14 days</button>
    <button data-days="30">Last 30 days</button>
    <label>Custom days (1–365) <input id="custom-lookback" type="number" min="1" max="365" step="1"></label>
    <div class="dialog-actions"><button id="lookback-cancel">Cancel</button><button id="lookback-apply">Apply</button></div>
  </dialog>
  <dialog id="lookahead-dialog">
    <h2>Show upcoming events</h2>
    <button data-ahead-days="0">Through today</button>
    <button data-ahead-days="1">Through tomorrow</button>
    <button data-ahead-days="3">Through 3 days ahead</button>
    <button data-ahead-days="7">Through 7 days ahead</button>
    <button data-ahead-days="14">Through 14 days ahead</button>
    <button data-ahead-days="30">Through 30 days ahead</button>
    <label>Custom days (0–36500) <input id="custom-lookahead" type="number" min="0" max="36500" step="1"></label>
    <div class="dialog-actions"><button id="lookahead-cancel">Cancel</button><button id="lookahead-apply">Apply</button></div>
  </dialog>
  <dialog id="skins-dialog">
    <h2>Skins</h2>
    <label>Theme <select id="skin-name"><option>Green</option><option>Blue</option><option>Purple</option><option>Rose</option></select></label>
    <div class="dialog-actions"><button id="skins-cancel">Cancel</button><button id="skins-apply">Apply</button></div>
  </dialog>
  <dialog id="calendar-dialog">
    <h2>Move event to date</h2>
    <label>New date <input id="date-picker" type="date" aria-label="Move event to date"></label>
  </dialog>
  <script type="module" src="window.js"></script>
</body>
</html>
